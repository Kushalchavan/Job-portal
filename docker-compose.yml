services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - jobportal-network

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: jobportal-api
    env_file:
      - ./apps/api/.env
    ports:
      - "3001:3001"
    depends_on:
      - redis
    networks:
      - jobportal-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
    - "80:80"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - api
    networks:
    - jobportal-network

networks:
  jobportal-network:
    driver: bridge
