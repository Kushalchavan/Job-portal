services:
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - jobportal-network

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: jobportal-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "3001:3001"
    depends_on:
      - redis
    networks:
      - jobportal-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - jobportal-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    networks:
      - jobportal-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - jobportal-network

volumes:
  redis-data:
  prometheus-data:
  grafana-storage:

networks:
  jobportal-network:
    driver: bridge