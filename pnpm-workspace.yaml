packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true

onlyBuiltDependencies:
  - "@google/genai"
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - bcrypt
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
