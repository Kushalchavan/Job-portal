packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@google/genai': set this to true or false
  '@scarf/scarf': set this to true or false
  esbuild: set this to true or false

onlyBuiltDependencies:
  - "@google/genai"
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - bcrypt
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
